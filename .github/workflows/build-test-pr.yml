name: Build and test PR

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run secrets scan
        uses: ministryofjustice/devsecops-actions/sca/moj@7dc13c20e2bf541b8a77fa1320a04983b18846f6 # v1.6.0

  check-api-version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check API changes have a version bump
        run: |
          BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)

          if git diff --quiet "$BASE_SHA" HEAD -- info-and-advice-datastore-api info-and-advice-datastore-client; then
            echo "No changes to info-and-advice-datastore-api or info-and-advice-datastore-client."
            exit 0
          fi

          if git diff --quiet "$BASE_SHA" HEAD -- gradle.properties; then
            echo "::error::info-and-advice-datastore-api or info-and-advice-datastore-client has changed but gradle.properties version has not been bumped. Manual intervention required: bump the 'version' property in gradle.properties before this PR can proceed."
            exit 1
          fi

          echo "info-and-advice-datastore-api or info-and-advice-datastore-client changed and gradle.properties version was bumped."

  build-test:
    needs:
      - check-api-version-bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: "corretto"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test coverage verification
        run: ./gradlew jacocoTestCoverageVerification

      - name: Integration test
        run: ./gradlew integrationTest

      - name: Upload checkstyle report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-report
          path: info-and-advice-datastore-service/build/reports/checkstyle
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: info-and-advice-datastore-service/build/reports/tests
          retention-days: 14

      - name: Upload jacoco coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: info-and-advice-datastore-service/build/reports/jacoco
          retention-days: 14

  bruno-tests:
    runs-on: ubuntu-latest
    needs:
      - build-test
    steps:
      - uses: actions/checkout@v7

      - name: Set up .env file
        run: cp .env.example .env

      - name: Add host.docker.internal to /etc/hosts
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Start application stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Run Bruno collection
        uses: usebruno/bruno-cli-action@v1
        with:
          working-directory: bruno-collections/info-and-advice-datastore-api-tests
          command: 'run --env UAT'

      - name: Stop application stack
        if: always()
        run: docker compose down -v

  vulnerability-scan-app:
    runs-on: ubuntu-latest
    needs:
      - build-test
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_TEST_EXCLUDE: build,generated
      SNYK_TARGET_REFERENCE: main
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Run Snyk to check app for vulnerabilities
        uses: snyk/actions/gradle@master
        with:
          command: code test
          args: --severity-threshold=high

  vulnerability-scan-docker:
    runs-on: ubuntu-latest
    needs:
      - build-test
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Build a Docker image
        run: docker build -t info-and-advice-datastore:scan .

      - name: Run Snyk to check Docker image for vulnerabilities
        uses: snyk/actions/docker@master
        with:
          image: info-and-advice-datastore:scan
          args: --file=Dockerfile --severity-threshold=high --policy-path=.snyk
