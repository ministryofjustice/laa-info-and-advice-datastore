name: ZAP Security Scanning
on:
  workflow_dispatch: # Allow manual triggering only
  workflow_call: # Allow this workflow to be called by other workflows

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Start application and dependencies
        run: docker compose up -d --build
        env:
          DB_USERNAME: laa_user
          DB_PASSWORD: laa_password

      - name: Wait for application to be healthy
        run: |
          echo "Waiting for application to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Application is healthy"
              exit 0
            fi
            echo "Attempt $i/30 - waiting 10s..."
            sleep 10
          done
          echo "Application failed to start within 5 minutes"
          docker compose logs info-and-advice-api
          exit 1
        env:
          DB_USERNAME: laa_user
          DB_PASSWORD: laa_password

      - name: Fetch OAuth2 token for ZAP authentication
        run: |
          TOKEN=$(curl -s -X POST http://localhost:9090/default/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=test&client_secret=test" \
            | jq -r .access_token)
          {
            printf "replacer.full_list(0).description=Authorization\n"
            printf "replacer.full_list(0).enabled=true\n"
            printf "replacer.full_list(0).matchtype=REQ_HEADER\n"
            printf "replacer.full_list(0).matchstr=Authorization\n"
            printf "replacer.full_list(0).replacement=Bearer %s\n" "${TOKEN}"
            printf "replacer.full_list(1).description=X-Authorization\n"
            printf "replacer.full_list(1).enabled=true\n"
            printf "replacer.full_list(1).matchtype=REQ_HEADER\n"
            printf "replacer.full_list(1).matchstr=X-Authorization\n"
            printf "replacer.full_list(1).replacement=Bearer %s\n" "${TOKEN}"
          } > zap.prop

      - name: Run ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: "http://localhost:8080/open-api-specification.yml"
          format: openapi
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-api-scan-report
          cmd_options: '-z "-configfile /zap/wrk/zap.prop"'

      - name: Upload ZAP HTML Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-scan-report-html
          path: report_html.html
          retention-days: 14
