# NOTE: deliberately workflow_dispatch-only for now. We don't yet have broker credentials
# (PACT_BROKER_URL/USERNAME/PASSWORD secrets) or any consumer publishing a pact against this
# provider, so running this on every PR/push would just fail CI. Re-add `pull_request`/`push`
# triggers once broker access is confirmed and at least one consumer pact exists to verify.
name: Pact Provider Verification
run-name: Pact verify — ${{ github.event.inputs.consumer || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      consumer:
        required: false
        description: "Consumer name (from broker webhook)"
      consumerBranch:
        required: false
        description: "Consumer branch (from broker webhook)"

permissions:
  contents: read

jobs:
  pact-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: "corretto"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify pacts
        run: ./gradlew :info-and-advice-datastore-service:pactTest
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          GIT_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
          PACT_CONSUMER: ${{ github.event.inputs.consumer }}
          PACT_CONSUMER_BRANCH: ${{ github.event.inputs.consumerBranch }}
