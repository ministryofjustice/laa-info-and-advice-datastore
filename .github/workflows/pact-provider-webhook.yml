# NOTE: deliberately workflow_dispatch-only for now. Broker credentials ARE configured
# (PACT_BROKER_URL/USERNAME/PASSWORD secrets), but no consumer has published a pact naming this
# provider yet - the broker 404s "for-verification" requests for pacticipants it has never seen,
# so running this on every PR/push would just fail CI. Re-add `pull_request`/`push` triggers once
# at least one consumer pact exists to verify.
name: Pact Provider Verification
run-name: Pact verify — ${{ github.event.inputs.consumer || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      consumer:
        required: false
        description: "Consumer name (from broker webhook)"
      consumerBranch:
        required: false
        description: "Consumer branch (from broker webhook)"

permissions:
  contents: read

jobs:
  pact-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: "corretto"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify pacts
        run: ./gradlew :info-and-advice-datastore-service:pactTest
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          GIT_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
          PACT_CONSUMER: ${{ github.event.inputs.consumer }}
          PACT_CONSUMER_BRANCH: ${{ github.event.inputs.consumerBranch }}
