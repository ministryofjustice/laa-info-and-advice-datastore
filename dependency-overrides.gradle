// Transitive dependency overrides for temporary CVE fixes

dependencies {
    implementation 'io.micrometer:micrometer-core:1.17.1'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-IOMICROMETER-19233327
    implementation 'org.springframework.security:spring-security-core:7.1.1'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORKSECURITY-19267441
    implementation 'org.springframework.security:spring-security-crypto:7.1.1'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORKSECURITY-19267391
    implementation 'org.springframework.security:spring-security-oauth2-jose:7.1.1'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORKSECURITY-19268249
    implementation 'org.springframework:spring-beans:7.0.9'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORK-19267072
    implementation 'org.springframework:spring-expression:7.0.9'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORK-19267073
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORK-19267075
    implementation 'org.springframework:spring-web:7.0.9'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORK-19267077
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORK-19267078
    implementation 'org.springframework:spring-webmvc:7.0.9'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORK-19267098
    implementation 'ch.qos.logback:logback-core:1.5.37'
    // logback-classic pinned to match logback-core; a version mismatch makes Logback dump its
    // internal bootstrap status log to the console, breaking up the normal log output
    implementation 'ch.qos.logback:logback-classic:1.5.37'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-CHQOSLOGBACK-17675439
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.24'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGAPACHETOMCATEMBED-17732890
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGAPACHETOMCATEMBED-17733746
    
    implementation 'com.fasterxml.jackson.core:jackson-core:2.21.7'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.7'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-TOOLSJACKSONCORE-19778371

    // fix https://security.snyk.io/vuln/SNYK-JAVA-COMFASTERXMLJACKSONCORE-20059683
    implementation 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGAPACHEHTTPCOMPONENTSCORE5-17817217
    implementation 'tools.jackson.core:jackson-core:3.2.3'
    //fix https://security.snyk.io/vuln/SNYK-JAVA-TOOLSJACKSONCORE-20059180
    implementation 'tools.jackson.core:jackson-databind:3.1.7'
}