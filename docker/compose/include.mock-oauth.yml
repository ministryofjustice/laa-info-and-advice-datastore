# Reusable building block: mock OAuth2 server (client_credentials only - no interactive login).
# laa-record-controlled-work-api defines its own richer variant (interactive login + jwt-bearer)
# and includes that instead when composing a stack that also needs user sign-in.
services:
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10@sha256:65d4ed47ce094cc3849e41e03499bfb32372d69c726ec22b3d5a19eba9bc787e
    container_name: mock-oauth2-server
    ports:
      - "9090:9090"
    environment:
      - SERVER_PORT=9090
      - JSON_CONFIG_PATH=/etc/mock-oauth2-config.json
    volumes:
      - ../../mock-oauth2-config.json:/etc/mock-oauth2-config.json
