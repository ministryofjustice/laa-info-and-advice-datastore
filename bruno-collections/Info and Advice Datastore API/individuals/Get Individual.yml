info:
  name: Get Individual
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v0/individuals/:id"
  params:
    - name: id
      value: 019d2f97-a648-7068-abab-6abe454a5052
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should be 200 response", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("all items should have correct properties", function(){
          const item = res.getBody();
          expect(item).to.have.property("individualLegalAidNumber");
          expect(item).to.have.property("firstName");
          expect(item).to.have.property("lastName");
          expect(item).to.have.property("lastNameAtBirth");
          expect(item).to.have.property("dateOfBirth");
          expect(item).to.have.property("niNumber");
          expect(item).to.have.property("createdAt");
          expect(item).to.have.property("modifiedAt");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v0/individuals/:id"
      method: GET
      params:
        - name: id
          value: 019d2f97-a648-7068-abab-6abe454a5052
          type: path
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "individualLegalAidNumber": "",
            "firstName": "",
            "lastName": "",
            "lastNameAtBirth": "",
            "dateOfBirth": "",
            "niNumber": "QQ123456B",
            "createdAt": "",
            "modifiedAt": ""
            }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v0/individuals"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Forbidden
    request:
      url: "{{baseUrl}}/api/v0/individuals"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Individual not found
    response:
      status: 404
      statusText: Not found
      body:
        type: text
        data: ""
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/v0/individuals"
      method: GET
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: text
        data: ""
