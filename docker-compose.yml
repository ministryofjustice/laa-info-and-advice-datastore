services:
  info-and-advice-api:
    container_name: info-and-advice-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on: 
      - postgres
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/laa_info_advice_datastore
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_PROFILES_ACTIVE=local
      
  postgres:
    image: postgres:18
    container_name: laa-info-and-advice-datastore
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: laa_info_advice_datastore
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /var/lib/postgresql/18/docker