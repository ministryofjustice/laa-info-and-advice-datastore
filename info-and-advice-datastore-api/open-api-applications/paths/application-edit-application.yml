patch:
  tags:
    - application
  operationId: editApplication
  summary: Edit an application
  description: >-
    Partially updates any user-defined field on the application, and optionally its linked client
    details (and address), declaration, and evidence in the same request. Only fields present in
    the request body are changed; omitted fields are left unchanged. The declaration and evidence
    are created if they don't already exist on the application. A declaration that has already
    been signed (has a dateSigned) is immutable and cannot be patched; attempting to do so returns
    a 409 Conflict. Applications with COMPLETED status cannot be edited and return 409 Conflict.
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: '../components/parameters.yml#/components/parameters/XAuthorizationHeader'
    - $ref: '../components/parameters.yml#/components/parameters/XCorrelationHeader'
    - $ref: '../components/parameters.yml#/components/parameters/XServiceNameHeader'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/request-schemas.yml#/components/schemas/EditApplicationCommand'
  responses:
    '204':
      description: Application edited successfully
      headers:
        ETag:
          description: The new ETag value for the updated resource
          schema:
            type: integer
            format: int64
    '400': { description: Bad request }
    '401': { description: Unauthorized }
    '403': { description: Forbidden }
    '404': { description: Not found }
    '409':
      {
        description: 'Conflict - application is completed, ETag mismatch, UFN already in use for this provider office code, or the declaration has already been signed',
      }
    '500': { description: Internal server error }
