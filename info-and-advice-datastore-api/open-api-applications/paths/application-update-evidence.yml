put:
  tags:
    - application
  summary: Update evidence for an application
  operationId: updateEvidence
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: '../components/parameters.yml#/components/parameters/XAuthorizationHeader'
  requestBody:
    required: true
    description: Confirmation of the evidence statement for the application.
    content:
      application/json:
        schema:
          $ref: '../components/request-schemas.yml#/components/schemas/UpdateEvidenceCommand'
  responses:
    '204': { description: Evidence updated successfully }
    '400': { description: Bad request }
    '401': { description: Unauthorized }
    '403': { description: Forbidden }
    '404': { description: Application not found }
    '409': { description: Conflict - ETag mismatch }
    '500': { description: Internal server error }