patch:
  tags:
    - application
  summary: Update declaration data for an application
  operationId: updateDeclarationData
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: '../components/parameters.yml#/components/parameters/XAuthorizationHeader'
  requestBody:
    required: true
    description: Confirmation of the declaration statement for the application.
    content:
      application/json:
        schema:
          $ref: '../components/request-schemas.yml#/components/schemas/DeclarationCommand'
  responses:
    '204': { description: Declaration updated successfully }
    '400':
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '../components/response-schemas.yml#/components/schemas/ApiError'
    '401':
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '../components/response-schemas.yml#/components/schemas/ApiError'
    '403':
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '../components/response-schemas.yml#/components/schemas/ApiError'
    '404':
      description: Application not found
      content:
        application/problem+json:
          schema:
            $ref: '../components/response-schemas.yml#/components/schemas/ApiError'
    '409':
      description: Conflict - ETag mismatch
      content:
        application/problem+json:
          schema:
            $ref: '../components/response-schemas.yml#/components/schemas/ApiError'
    '500':
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '../components/response-schemas.yml#/components/schemas/ApiError'
