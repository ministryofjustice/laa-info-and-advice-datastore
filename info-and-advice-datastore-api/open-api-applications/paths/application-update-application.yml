patch:
  tags:
    - application
  operationId: updateApplication
  summary: Update an application
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: '../components/parameters.yml#/components/parameters/XAuthorizationHeader'
    - $ref: '../components/parameters.yml#/components/parameters/XCorrelationHeader'
    - $ref: '../components/parameters.yml#/components/parameters/XServiceNameHeader'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/request-schemas.yml#/components/schemas/UpdateApplicationCommand'
  responses:
    '204':
      description: Application updated successfully
      headers:
        ETag:
          description: The new ETag value for the updated resource
          schema:
            type: integer
            format: int64
    '400': { description: Bad request }
    '401': { description: Unauthorized }
    '403': { description: Forbidden }
    '404': { description: Not found }
    '409': { description: Conflict - ETag mismatch }
    '410': { description: Gone - application has been deleted due to retention policies }
    '429':
      description: Too many requests - per-user rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '../components/response-schemas.yml#/components/schemas/ApiError'
    '500': { description: Internal server error }
