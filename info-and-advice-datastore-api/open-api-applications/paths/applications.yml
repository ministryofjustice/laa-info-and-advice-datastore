get:
  tags:
    - application
  summary: Get applications
  operationId: getApplications
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
    - name: size
      in: query
      required: false
      schema:
        type: integer
        default: 25
    - name: officeId
      in: query
      required: false
      schema:
        type: string
    - name: status
      in: query
      required: false
      schema:
        $ref: '../components/response-schemas.yml#/components/schemas/ApplicationState'
    - name: eligibilityIndication
      in: query
      required: false
      description: >
        Match applications with any assessment having this indication. The
        summary's eligibilityIndication reflects the most recent assessment.
      schema:
        $ref: '../components/response-schemas.yml#/components/schemas/EligibilityIndication'
    - name: includeMeansExemptApplications
      in: query
      required: false
      description: >
        When true and eligibilityIndication is supplied, also include applications
        whose stored meansAssessmentRequired is false. Other filters still apply.
        When eligibilityIndication is omitted, this parameter has no effect.
        Omitted or false preserves the existing eligibility filter. An exempt
        application can be included regardless of its assessment indication.
      schema:
        type: boolean
    - $ref: '../components/parameters.yml#/components/parameters/XAuthorizationHeader'
    - $ref: '../components/parameters.yml#/components/parameters/XCorrelationHeader'
    - $ref: '../components/parameters.yml#/components/parameters/XServiceNameHeader'
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: '../components/response-schemas.yml#/components/schemas/ApplicationResponses'
    '401':
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '../components/response-schemas.yml#/components/schemas/ApiError'
    '403':
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '../components/response-schemas.yml#/components/schemas/ApiError'
    '429':
      $ref: '../components/responses.yml#/components/responses/TooManyRequests'
    '500':
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '../components/response-schemas.yml#/components/schemas/ApiError'