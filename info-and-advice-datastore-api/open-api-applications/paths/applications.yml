get:
  tags:
    - application
  summary: Get applications
  operationId: getApplications
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
    - name: size
      in: query
      required: false
      schema:
        type: integer
        default: 25
    - name: officeId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: status
      in: query
      required: false
      schema:
        $ref: '../components/response-schemas.yml#/components/schemas/ApplicationState'
    - $ref: '../components/parameters.yml#/components/parameters/XAuthorizationHeader'
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: '../components/response-schemas.yml#/components/schemas/ApplicationResponses'
    '401': { description: Unauthorized }
    '403': { description: Forbidden }
    '500': { description: Internal server error }