components:
  schemas:
    ClientDetails:
      properties:
        individualLegalAidNumber:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        niNumber:
          type: string
          example: QQ123456B
          minLength: 9
          maxLength: 9
          pattern: '^(?!BG|GB|KN|NK|NT|TN|ZZ)[A-CEGHJ-PR-TW-Z][A-CEGHJ-NPR-TW-Z][0-9]{6}[ABCD]$'
        noFixedAbode:
          type: boolean
        address:
          $ref: "#/components/schemas/Address"
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    Address:
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
        addressLine3:
          type: string
        addressLine4:
          type: string
        townOrCity:
          type: string
        postCode:
          type: string
        county:
          type: string
        country:
          type: string
          maxLength: 2
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    CreateClientCommand:
      type: object
      required:
        - firstName
        - lastName
        - dateOfBirth
        - noFixedAbode
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
           type: string
           format: date
        nationalInsuranceNumber:
          type: string
          pattern: '^(?!BG|GB|KN|NK|NT|TN|ZZ)[A-CEGHJ-PR-TW-Z][A-CEGHJ-NPR-TW-Z][0-9]{6}[ABCD]$'
          example: AC123456D
        noFixedAbode:
          type: boolean
        createAddressCommand:
          $ref: '#/components/schemas/CreateAddressCommand'

    CreateAddressCommand:
      type: object
      required:
        - addressLine1
        - country
      properties:
        addressLine1:
          type: string
          example: 10 Downing Street
        addressLine2:
          type: string
        addressLine3:
          type: string
        addressLine4:
          type: string
        townOrCity:
          type: string
          example: London
        postCode:
          type: string 
          example: SW1A 2AA
        county:
          type: string
        country:
          type: string
          maxLength: 2
          example: GB