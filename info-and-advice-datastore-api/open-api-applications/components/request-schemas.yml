components:
  schemas:
    StartApplicationCommand:
      type: object
      required:
        - client
        - applicationType
        - providerOfficeCode
      properties:
        client:
          $ref: '../client-details-components.yml#/components/schemas/CreateClientCommand'
        applicationType:
          type: string
          enum:
            - RCW
            - CLA
        providerOfficeCode:
          type: string

    DeclarationCommand:
      type: object
      required:
        - eTag
        - declarationConfirmation
        - dateSigned
      properties:
        eTag:
          type: integer
          format: int64
          description: ETag value for optimistic concurrency control
        declarationConfirmation:
          type: boolean
        dateSigned:
          type: string
          format: date
          x-extra-annotation: "@jakarta.validation.constraints.PastOrPresent"

    UpdateEvidenceCommand:
      type: object
      required:
        - eTag
      properties:
        eTag:
          type: integer
          format: int64
          description: ETag value for optimistic concurrency control
        evidenceExemptionCode:
          type: string
        evidenceExemptionReason:
          type: string
          maxLength: 400
        incomeEvidenceChecklist:
          type: object
        expenditureCapitalEvidenceChecklist:
          type: object

    UpdateMeansDataCommand:
      type: object
      required:
        - eTag
        - data
        - result
      properties:
        eTag:
          type: integer
          format: int64
          description: ETag value for optimistic concurrency control
        data:
          type: object
          description: The means assessment question and answer data
        result:
          type: object
          description: The means assessment calculation result

    UpdateScopingDataCommand:
      type: object
      required:
        - eTag
      properties:
        eTag:
          type: integer
          format: int64
          description: ETag value for optimistic concurrency control
        scopingQuestions:
          type: object
          nullable: true
          additionalProperties: true

    UpdateApplicationCommand:
      type: object
      required:
        - eTag
      properties:
        eTag:
          type: integer
          format: int64
          description: ETag value for optimistic concurrency control
        applicationState:
          $ref: 'response-schemas.yml#/components/schemas/ApplicationState'

    EditApplicationCommand:
      type: object
      required:
        - eTag
      properties:
        eTag:
          type: integer
          format: int64
          description: ETag value for optimistic concurrency control
        ufn:
          type: string
          maxLength: 9
        laaReference:
          type: string
        reasonForReapplication:
          type: string
        meansAssessmentRequired:
          type: boolean
        typeOfNonMeans:
          type: boolean
        ecfFlag:
          type: boolean
        contribution:
          type: string
        determinationId:
          type: string
          format: uuid

    UpdateClientDetailsCommand:
      type: object
      required:
        - eTag
      properties:
        eTag:
          type: integer
          format: int64
          description: ETag value for optimistic concurrency control
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        niNumber:
          type: string
          example: QQ123456B
          minLength: 9
          maxLength: 9
        noFixedAbode:
          type: boolean
        address:
          $ref: '#/components/schemas/UpdateAddressCommand'

    UpdateAddressCommand:
      type: object
      properties:
        addressLine1:
          type: string
          example: 10 Downing Street
        addressLine2:
          type: string
        addressLine3:
          type: string
        addressLine4:
          type: string
        townOrCity:
          type: string
          example: London
        postCode:
          type: string
          example: SW1A 2AA
        county:
          type: string
        country:
          type: string
          maxLength: 2
          example: GB