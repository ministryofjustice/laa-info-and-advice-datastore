components:
  schemas:
    ClientDetails:
      $ref: '../client-details-components.yml#/components/schemas/ClientDetails'

    Address:
      $ref: '../client-details-components.yml#/components/schemas/Address'

    ApplicationResponse:
      type: object
      required:
        - id
        - individualLegalAidNumber
        - client
        - providerFirmCode
        - providerOfficeCode
        - createdAt
        - createdBy
        - modifiedAt
        - modifiedBy
      properties:
        id:
          type: string
          format: uuid
          example:
        individualLegalAidNumber:
          type: string
          format: uuid
          example:
          description:
        client:
          $ref: '#/components/schemas/ClientDetails'
        providerFirmCode:
          type: string
          example:
          description:
        providerOfficeCode:
          type: string
          example:
          description:
        applicationState:
          $ref: '#/components/schemas/ApplicationState'
        declaration:
          $ref: '#/components/schemas/DeclarationResponse'
        evidence:
          $ref: '#/components/schemas/EvidenceResponse'
        reasonForReapplication:
          type: string
        meansAssessmentRequired:
          type: boolean
        typeOfNonMeans:
          type: boolean
        ecfFlag:
          type: boolean
        contribution:
          type: string
        referenceNumber:
          type: string
        laaReference:
          type: string
        applicationType:
          type: string
        scopingQuestions:
          type: object
        isMeansTested:
          type: boolean
        ufn:
          type: string
          maxLength: 9
        determinationId:
          type: string
          format: uuid
        eligibilityResult:
          $ref: '#/components/schemas/EligibilityResult'
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        modifiedAt:
          type: string
          format: date-time
        modifiedBy:
          type: string
        eTag:
          type: integer
          format: int64
          description: ETag value for optimistic concurrency control

    ApplicationSummary:
      type: object
      description: Slim representation of an application for use in list views
      required:
        - id
        - referenceNumber
        - modifiedAt
      properties:
        id:
          type: string
          format: uuid
        clientFirstName:
          type: string
        clientLastName:
          type: string
        referenceNumber:
          type: string
        modifiedAt:
          type: string
          format: date-time
        eligibilityIndication:
          $ref: '#/components/schemas/EligibilityIndication'

    ApplicationResponses:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    DeclarationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientDeclarationStatus:
          $ref: '#/components/schemas/ClientDeclarationStatus'
        declarationConfirmation:
          type: boolean
        dateSigned:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        modifiedAt:
          type: string
          format: date-time
        modifiedBy:
          type: string

    ClientDeclarationStatus:
      type: string
      enum:
        - DRAFT

    ApplicationState:
      type: string
      enum:
        - DRAFT
        - COMPLETED

    EligibilityIndication:
      type: string
      enum:
        - eligible
        - ineligible

    EvidenceResponse:
      type: object
      properties:
        evidenceExemptionCode:
          type: string
        evidenceExemptionReason:
          type: string
        incomeEvidenceChecklist:
          type: object
        expenditureCapitalEvidenceChecklist:
          type: object

    EligibilityResult:
      type: object
      properties:
        data:
          type: object
          description: The means assessment question and answer data
        result:
          type: object
          description: The means assessment calculation result

    ApiError:
      type: object
      description: RFC 7807 problem detail returned for error responses
      properties:
        title:
          type: string
          description: A short, human-readable summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem