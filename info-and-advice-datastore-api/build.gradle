plugins {
    id 'org.openapi.generator' version '7.23.0'
    id 'uk.gov.laa.springboot.laa-spring-boot-gradle-plugin'
    id 'maven-publish'
}

version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.10'
    implementation platform("com.fasterxml.jackson:jackson-bom:2.22.1")
}

sourceSets.main.java.srcDirs += ['generated/src/main/java']

checkstyleMain.exclude "*"

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$rootDir/info-and-advice-datastore-api/open-api-specification.yml".toString()
    outputDir = "$rootDir/info-and-advice-datastore-api/generated".toString()
    apiPackage = "uk.gov.justice.laa.ia.datastore.api"
    invokerPackage = "uk.gov.justice.laa.ia.datastore.invoker"
    modelPackage = "uk.gov.justice.laa.ia.datastore.model"
    configOptions = [
            generateBuilders    : "true",
            interfaceOnly       : "true", // This will only generate interfaces, not implementations
            serializableModel   : "true",
            skipDefaultInterface: "true",
            useJakartaEe        : "true",
            useSpringBoot3      : "true",
            useTags             : "true",
    ]
}

compileJava.dependsOn 'openApiGenerate'

clean {
    delete "$rootDir/info-and-advice-datastore-api/generated"
}

// disable for overall project when running a build
tasks.named('bootJar') {
    enabled = false
}

tasks.named('bootRun') {
    enabled = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'uk.gov.justice.laa.ia.datastore'
            artifactId = 'info-and-advice-datastore-api'
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = 'https://maven.pkg.github.com/ministryofjustice/laa-info-and-advice-datastore'
            credentials {
                username = System.getenv("GITHUB_ACTOR")?.trim() ?: project.findProperty('gitPackageUser')
                password = System.getenv("GITHUB_TOKEN")?.trim() ?: project.findProperty('gitPackageKey')
            }
        }
    }
}