openapi: "3.0.0"
info:
  version: 1.0.0
  title: Info and Advice Datastore API
paths:
  /api/v0/individuals:
    get:
      tags:
        - individuals
      summary: Get individuals
      operationId: getIndividuals
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Individuals"
        '401': { description: 'Unauthorized' }
        '403': { description: 'Forbidden' }
        '500': { description: 'Internal server error' }
  /api/v0/individuals/{id}:
    get:
      tags:
        - individuals
      summary: Get individual
      operationId: getIndividual
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Individual"
        '401' : { description: 'Unauthorized' }
        '403' : { description: 'Forbidden' }
        '404' : { description: 'Not found' }
        '500' : { description: 'Internal server error' }

components:
  schemas:
    Individual:
      properties:
        individualLegalAidNumber:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        lastNameAtBirth:
          type: string
        dateOfBirth:
          type: string
          format: date
        niNumber:
          type: string
          example: QQ123456B
          minLength: 9
          maxLength: 9
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    Individuals:
      type: array
      items:
        $ref: "#/components/schemas/Individual"

    Address:
      properties:
        clientHasHomeAddress:
          type: boolean
        addressLine1:
          type: string
        addressLine2:
          type: string
        townOrCity:
          type: string
        postCode:
          type: string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    
    ApplicationResponse:
      type: object
      required:
        - referenceNumber
        - individualLegalAidNumber
        - providerFirmId
        - providerOfficeId
        - createdAt
        - createdBy
        - modifiedAt
        - modifiedBy
      properties:
        referenceNumber:
          type: string
          format: uuid
          example: 
        individualLegalAidNumber:
          type: string
          format: uuid
          example:
          description:
        providerFirmId:
          type: string 
          format: uuid
          example:
          description:
        providerOfficeId:
          type: string 
          format: uuid
          example: 
          description:
        eligibilityResult:
          type: string
          format: uuid
          example:
          description:
        clientCaseDetailsStatus:
          $ref: "#/components/schemas/ClientCaseDetailsStatus"
        meansAssessmentStatus:
          type: string
          format: uuid
        evidenceStatus:
          type: string
          format: uuid
        clientDeclarationStatus:
          type: string
          format: uuid
        overallApplicationStatus:
          $ref: "#/components/schemas/OverallApplicationStatus"
        uniqueFileNumber:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        modifiedAt:
          type: string
          format: date-time
        modifiedBy:
          type: string

    CaseDetailsResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
          format: uuid
        requireEcf:
          type: boolean
        hasPreviousLegalAid:
          type: boolean
        hasSixMonthsLegalHelp:
          type: boolean
        meansAssessmentRequired:
          type: boolean
        typeNonMeansTested:
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        modifiedAt:
          type: string
          format: date-time
        modifiedBy:
          type: string

    DeclarationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
          format: uuid
        clientDeclarationStatus:
          $ref: "#/components/schemas/ClientDeclarationStatus"
        declarationStatement:
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        modifiedAt:
          type: string
          format: date-time
        modifiedBy:
          type: string
        

    EvidenceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
          format: uuid
        evidenceStatus:
          $ref: "#/components/schemas/EvidenceStatus"
        payeIncomeEvidence:
          type: boolean
        otherIncomeEvidence:
          type: boolean
        housingCostsEvidence:
          type: boolean
        capitalEvidence:
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        modifiedAt:
          type: string
          format: date-time
        modifiedBy:
          type: string

    ClientCaseDetailsStatus:
      type: string
      enum:
        - DRAFT

    ClientDeclarationStatus:
      type: string
      enum:
        - DRAFT
    EvidenceStatus:
      type: string
      enum:
        - DRAFT
    OverallApplicationStatus:
      type: string
      enum:
        - DRAFT