openapi: "3.0.0"
info:
  version: 1.0.0
  title: Info and Advice Datastore API
paths:
  /api/v0/individuals:
    get:
      tags:
        - individuals
      summary: Get individuals
      operationId: getIndividuals
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Individuals"
        '401': { description: 'Unauthorized' }
        '403': { description: 'Forbidden' }
        '500': { description: 'Internal server error' }

components:
  schemas:
    Individual:
      properties:
        individualLegalAidNumber:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        lastNameAtBirth:
          type: string
        dateOfBirth:
          type: string
          format: date
        niNumber:
          type: string
          example: QQ123456B
          minLength: 9
          maxLength: 9
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    Individuals:
      type: array
      items:
        $ref: "#/components/schemas/Individual"