{{- if include "your-repo-name.backupsEnabled" . }}
{{- range list (dict "tier" "hourly" "schedule" "0 * * * *") (dict "tier" "daily" "schedule" "30 9 * * *") }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "your-repo-name.fullname" $ }}-backup-{{ .tier }}
  labels:
    {{- include "your-repo-name.labels" $ | nindent 4 }}
    app.kubernetes.io/component: backup
    backup-tier: {{ .tier }}
spec:
  schedule: {{ .schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1900
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "your-repo-name.name" $ }}-backup
            app.kubernetes.io/instance: {{ $.Release.Name }}
            app.kubernetes.io/component: backup
            backup-tier: {{ .tier }}
        spec:
          serviceAccountName: {{ $.Values.backups.serviceAccountName }}
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/os: linux
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rds-backup
              image: {{ $.Values.backups.image | quote }}
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - -c
                - |
                  import os
                  import sys
                  os.execv(sys.executable, [
                      sys.executable, "/backups/rds-backup.py",
                      "--db-instance-identifier", os.environ["RDS_ADDRESS"].split(".", 1)[0],
                      *sys.argv[1:],
                  ])
              args:
                - --region
                - {{ $.Values.backups.region | quote }}
                - --env
                - {{ $.Values.backups.environment | quote }}
                - --tier
                - {{ .tier }}
                - --creation-enabled
                - {{ $.Values.backups.creationEnabled | quote }}
                - --run-id
                - $(BACKUP_RUN_ID)
              env:
                - name: RDS_ADDRESS
                  valueFrom:
                    secretKeyRef:
                      name: rds-postgresql-instance-output
                      key: rds_instance_address
                - name: BACKUP_RUN_ID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/job-name']
                - name: SENTRY_DSN
                  valueFrom:
                    secretKeyRef:
                      name: laa-info-and-advice-datastore-sentry
                      key: SENTRY_DSN
                      optional: true
                - name: BACKUP_SENTRY_SCHEDULE
                  value: {{ .schedule | quote }}
                - name: AWS_DEFAULT_REGION
                  value: {{ $.Values.backups.region | quote }}
                - name: HOME
                  value: /tmp
                - name: TMPDIR
                  value: /tmp
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: script
                  mountPath: /backups
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: {{ include "your-repo-name.fullname" $ }}-rds-backup
                defaultMode: 0444
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
{{- end }}
{{- end }}
