apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "your-repo-name.fullname" . }}
  labels:
    {{- include "your-repo-name.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "your-repo-name.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "your-repo-name.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "your-repo-name.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .Values.env.SPRING_PROFILES_ACTIVE }}"
            - name: SERVICE_NAME
              value: "{{ .Values.env.SERVICE_NAME }}"
            - name: SERVICE_PHASE
              value: "{{ .Values.env.SERVICE_PHASE }}"
            - name: DEPARTMENT_NAME
              value: "{{ .Values.env.DEPARTMENT_NAME }}"
            - name: DEPARTMENT_URL
              value: "{{ .Values.env.DEPARTMENT_URL }}"
            - name: CONTACT_EMAIL
              value: "{{ .Values.env.CONTACT_EMAIL }}"
            - name: CONTACT_PHONE
              value: "{{ .Values.env.CONTACT_PHONE }}"
            - name: SERVICE_URL
              value: "{{ .Values.env.SERVICE_URL }}"
            - name: SESSION_SECRET
              value: "{{ .Values.env.SESSION_SECRET }}"
            - name: SESSION_NAME
              value: "{{ .Values.env.SESSION_NAME }}"
            - name: RATELIMIT_HEADERS_ENABLED
              value: "{{ .Values.env.RATELIMIT_HEADERS_ENABLED }}"
            - name: RATELIMIT_STORAGE_URI
              value: "{{ .Values.env.RATELIMIT_STORAGE_URI }}"
            - name: RATE_LIMIT_MAX
              value: "{{ .Values.env.RATE_LIMIT_MAX }}"
            - name: RATE_WINDOW_MS
              value: "{{ .Values.env.RATE_WINDOW_MS }}"
            - name: NODE_ENV
              value: "{{ .Values.env.NODE_ENV }}"
            - name: LAA_OAUTH2_ISSUER_URI
              valueFrom:
                secretKeyRef:
                  name: laa-info-and-advice-datastore-entra
                  key: LAA_OAUTH2_ISSUER_URI
            - name: LAA_OAUTH2_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: laa-info-and-advice-datastore-entra
                  key: LAA_OAUTH2_AUDIENCE
            - name: TRUSTED_CALLER_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: laa-info-and-advice-datastore-entra
                  key: TRUSTED_CALLER_AUDIENCE
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: rds-postgresql-instance-output
                  key: database_name
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rds-postgresql-instance-output
                  key: database_username
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: rds-postgresql-instance-output
                  key: rds_instance_endpoint
            - name: DB_URL
              value: "jdbc:aws-wrapper:postgresql://$(DB_HOST)/$(DB_NAME)?wrapperPlugins=iam&sslmode=require"
            - name: DB_DRIVER_CLASS
              value: "software.amazon.jdbc.Driver"
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
