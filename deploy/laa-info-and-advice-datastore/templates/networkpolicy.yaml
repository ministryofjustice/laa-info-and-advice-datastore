{{- if .Values.networkPolicy.enabled -}}
{{- range .Values.networkPolicy.policies }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    {{- include "your-repo-name.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    {{- toYaml .policyTypes | nindent 4 }}
  {{- if .ingress }}
  ingress:
    {{- toYaml .ingress | nindent 4 }}
  {{- end }}
  {{- if .egress }}
  egress:
    {{- toYaml .egress | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
