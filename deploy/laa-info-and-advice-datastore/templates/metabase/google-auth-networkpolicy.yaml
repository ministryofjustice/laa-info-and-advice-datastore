{{- if and .Values.metabase.enabled .Values.metabase.googleAuth.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "your-repo-name.fullname" . }}-metabase-google-auth
  labels:
    {{- include "your-repo-name.labels" . | nindent 4 }}
    app.kubernetes.io/component: metabase
spec:
  podSelector:
    matchLabels:
      {{- include "your-repo-name.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metabase
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
{{- end }}
