{{- if .Values.metabase.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "your-repo-name.fullname" . }}-metabase
  labels:
    {{- include "your-repo-name.labels" . | nindent 4 }}
    app.kubernetes.io/component: metabase
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.metabase.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "your-repo-name.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: metabase
{{- end }}
