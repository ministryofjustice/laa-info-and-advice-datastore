pluginManagement {
    repositories {
        mavenCentral()
        maven { url = "https://plugins.gradle.org/m2/" }
        gradlePluginPortal()
    }

    plugins {
        id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin' version '3.0.0'
        id 'org.openapi.generator' version '7.24.0'
        id 'io.freefair.lombok' version '9.5.0'
    }
}

rootProject.name = 'laa-info-and-advice-datastore'

include 'info-and-advice-datastore-api'
include 'info-and-advice-datastore-client'
include 'info-and-advice-datastore-service'

