spring:
  application:
    name: LAA Information and Advice Datastore

  # example database
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/laa_info_advice_datastore}
    username: ${DB_USERNAME:laa_user}
    password: ${DB_PASSWORD:laa_password}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: true

  #do not auto create db schema, use .sql scripts
  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration

# used by actuator info endpoint
info:
  app:
    name: LAA Information and Advice Datastore
    description: Datastore for information and advice
    version: 1.0.0

management:
  # specify actuator endpoints to enable
  endpoints:
    web:
      exposure:
        include: health

laa:
  springboot.starter:
    oauth2:
      resourceserver:
        jwt:
          tenants:
            - issuer-uri: ${LAA_OAUTH2_ISSUER_URI:https://placeholder.issuer.uri/v2.0}
              audiences:
                - ${LAA_OAUTH2_AUDIENCE:api://placeholder-audience}
      # Scope names are placeholders — update to match Entra app registration delegated permissions
      authorized-scopes: '[
        {
          "name": "applications:read",
          "uris": [
            {"method":["GET"],"uri":"/api/v0/applications"},
            {"method":["GET"],"uri":"/api/v0/applications/**"}
          ]
        },
        {
          "name": "applications:write",
          "uris": [
            {"method":["POST"],"uri":"/api/v0/applications:start-case"},
            {"method":["PUT"],"uri":"/api/v0/applications/**"}
          ]
        }
      ]'
      unprotected-uris: [ "/actuator/**", "/swagger-ui.html",
                          "/swagger-ui/**", "/v3/api-docs/**", "/favicon.ico",
                          "/open-api-specification.yml" ]
