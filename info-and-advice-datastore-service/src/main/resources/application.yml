spring:
  application:
    name: laa-info-and-advice-datastore

  # example database
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/laa_info_advice_datastore}
    username: ${DB_USERNAME:laa_user}
    password: ${DB_PASSWORD:laa_password}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: true

  #do not auto create db schema, use .sql scripts
  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration

# used by actuator info endpoint
info:
  app:
    name: LAA Information and Advice Datastore
    description: Datastore for information and advice
    version: 1.0.0

sentry:
  # Blank disables the SDK (no events are sent) - set SENTRY_DSN to enable.
  enabled: ${SENTRY_ENABLED:true}
  dsn: ${SENTRY_DSN:}
  environment: ${SPRING_PROFILES_ACTIVE:local}
  release: ${SENTRY_RELEASE:laa-info-and-advice-datastore@local}
  send-default-pii: false
  exception-resolver-order: -2147483647
  # Set to 0 to disable tracing; use a value from 0 to 1 to control sampling.
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.01}
  ignored-transactions:
    - '^(?:[A-Z]+ )?/metrics/?$'
  # Enables structured log delivery through our custom SentryLoggingConfiguration appender.
  logs:
    enabled: ${SENTRY_LOGS_ENABLED:true}
  # Disables Sentry's automatic Logback appender, not structured log delivery above.
  # Our custom appender disables error events and breadcrumbs to avoid bypassing log redaction.
  logging:
    enabled: false

management:
  # specify actuator endpoints to enable
  endpoints:
    web:
      exposure:
        include: health, prometheus
    health:
      show-details: always

logging:
  level:
    root: ${ROOT_LOGGING_LEVEL:info}
    # Audit trail must never be silenced by tuning the root/app levels.
    audit: info
    org.springframework: ${SPRING_LOGGING_LEVEL:info}
    org.springframework.security: ${SPRING_SECURITY_LOGGING_LEVEL:debug}
    org.springframework.security.oauth2: ${SPRING_SECURITY_OAUTH2_LOGGING_LEVEL:debug}
    org.springframework.security.oauth2.jwt: ${SPRING_SECURITY_OAUTH2_JWT_LOGGING_LEVEL:debug}
    org.springframework.security.oauth2.server.resource: ${SPRING_SECURITY_OAUTH2_SERVER_RESOURCE_LOGGING_LEVEL:debug}
    org.springframework.boot.actuate: warn
    uk.gov.laa.springboot.oauth2: ${LAA_SPRINGBOOT_OAUTH2_LOGGING_LEVEL:debug}
    uk.gov.justice.laa.springboot.microservice: ${APP_LOGGING_LEVEL:info}
    uk.gov.justice.laa.rcw: ${APP_LOGGING_LEVEL:info}
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${spring.application.version:unknown}
        environment: ${spring.profiles.active:default}
        node_name: ${HOSTNAME:unknown}

laa:
  datastore:
    # In-memory, per-caller rate limit (Resilience4j). Counters are per container instance, so the
    # effective limit scales with the number of running containers.
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      limit-for-period: ${RATE_LIMIT_REQUESTS:100}
      refresh-period: ${RATE_LIMIT_REFRESH_PERIOD:1m}
    # Claims API used to decide data retention. Defaults to a stub; set mode to "live" with a base
    # URL and API key to call the real API.
    claims-api:
      mode: ${CLAIMS_API_MODE:stub}
      base-url: ${CLAIMS_API_URL:}
      api-key: ${CLAIMS_API_KEY:}
      page-size: ${CLAIMS_API_PAGE_SIZE:100}
      connect-timeout: ${CLAIMS_API_CONNECT_TIMEOUT:5s}
      read-timeout: ${CLAIMS_API_READ_TIMEOUT:30s}
    data-retention:
      years-offset: ${DATA_RETENTION_YEARS_OFFSET:3}
      # Nightly schedulers for deployed environments; off unless explicitly enabled per environment.
      schedulers-enabled: ${DATA_RETENTION_SCHEDULERS_ENABLED:false}
      cron: ${RETENTION_RESOLVER_CRON:0 0 0 * * *}
      deletion-cron: ${RETENTION_DELETION_CRON:0 0 1 * * *}
    # Trusts the forwarded X-Authorization token (UserContextInterceptor) issued for the calling
    # service's own audience - deliberately separate from resourceserver.jwt tenants below so this
    # trust never extends to the primary Authorization header/endpoint authorization.
    trusted-caller:
      issuer-uri: ${LAA_OAUTH2_ISSUER_URI:https://placeholder.issuer.uri/v2.0}
      audience: ${TRUSTED_CALLER_AUDIENCE:api://placeholder-caller-audience}
    # Field names redacted out of recorded event payloads (see EventService/PiiRedactor) and
    # stashed in EventEntity.piiData instead, keyed by a generated UUID.
    events:
      pii:
        fields:
          - firstName
          - lastName
          - dateOfBirth
          - niNumber
          - nationalInsuranceNumber
          - addressLine1
          - addressLine2
          - addressLine3
          - addressLine4
          - townOrCity
          - postCode
          - county
          - clientFirstName
          - clientLastName
  security:
    # Content-Security-Policy reporting endpoint - blank disables the header.
    csp-report-uri: ${SENTRY_CSP_REPORT_URI:}
    csp-security-token: ${SENTRY_SECURITY_TOKEN:}
  springboot.starter:
    oauth2:
      scopes-claim-path: scp
      resourceserver:
        jwt:
          tenants:
            - issuer-uri: ${LAA_OAUTH2_ISSUER_URI:https://placeholder.issuer.uri/v2.0}
              audiences:
                - ${LAA_OAUTH2_AUDIENCE:api://placeholder-audience}
      authorized-scopes: '[
          {
            "name": "DataStore.Access",
            "uris": [
              {"method":["GET","POST","PUT","PATCH","DELETE"],"uri":"/api/v0/**"}
            ]
          }
        ]'
      unprotected-uris: [ "/actuator/**", "/swagger-ui.html",
                          "/swagger-ui/**", "/v3/api-docs/**", "/favicon.ico",
                          "/open-api-specification.yml", "/error" ]

