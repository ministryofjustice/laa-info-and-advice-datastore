# Pact PROVIDER verification config (Java / pact-jvm), profile: test
# Boot the app with no DB and no real security so state handlers just stub ApplicationService.

laa:
  datastore:
    # Only read by TrustedCallerJwtDecoder's @Value injection (not an autoconfig bean, so it isn't
    # covered by the excludes below) - dummy values since SecurityFilterChainAutoConfiguration is
    # excluded and nothing in this test actually validates a JWT against them.
    trusted-caller:
      issuer-uri: https://placeholder.issuer.uri/v2.0
      audience: api://placeholder-caller-audience
    # This file entirely shadows the main application.yml on the classpath (Spring Boot only loads
    # the first application.yml it finds), so properties read via @Value elsewhere in the app -
    # even ones with a ${PLACEHOLDER:default} fallback in main's copy - must be repeated here or
    # they fail to resolve. Read by DataDeletionTask/DataRetentionDateResolverTask/
    # DraftDataDeletionTask, which get instantiated via component scanning regardless of active
    # profile.
    data-retention:
      years-offset: 3
      draft-years-offset: 2
      ineligible-years-offset: 3
    # Read by PiiRedactor, which is also unconditionally component-scanned; an empty/missing
    # binding here throws an NPE in its constructor rather than defaulting to no fields.
    events:
      pii:
        fields:
          - firstName
          - lastName
          - dateOfBirth
          - niNumber

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      # Disables the laa-spring-boot-starter-oauth2 security filter chain so the
      # @TargetRequestFilter-injected headers aren't rejected by real JWT validation.
      - uk.gov.laa.springboot.oauth2.SecurityFilterChainAutoConfiguration
      - uk.gov.laa.springboot.oauth2.MultiTenantJwtAuthenticationManagerResolverAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
