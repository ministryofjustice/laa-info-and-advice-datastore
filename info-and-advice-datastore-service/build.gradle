plugins {
    id 'io.freefair.lombok' version '9.5.0'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
    id 'com.diffplug.spotless' version "8.10.1"
}

configurations.configureEach {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'ch.qos.logback' && details.requested.name == 'logback-core') {
            details.useVersion '1.5.36'
            details.because 'CVE fix: Expression Injection in logback-core < 1.5.36'
        }
        if (details.requested.group == 'com.fasterxml.jackson.core' && details.requested.name == 'jackson-databind') {
            details.useVersion '2.21.5'
            details.because 'CVE fix: Incorrect Authorization in jackson-databind < 2.21.5'
        }
        if (details.requested.group == 'tools.jackson.core' && details.requested.name == 'jackson-databind') {
            details.useVersion '3.1.5'
            details.because 'CVE fix: Incorrect Authorization in jackson-databind < 3.1.5'
        }
        if (details.requested.group == 'io.micrometer' && details.requested.name == 'micrometer-core') {
            details.useVersion '1.17.1'
            details.because 'CVE fix: CRLF Injection in micrometer-core < 1.17.1'
        }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/SpringBootMicroserviceApplication.class'])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/SpringBootMicroserviceApplication.class'])
        }))
    }
}

dependencies {
    implementation project(':info-and-advice-datastore-api')
    implementation 'org.openapitools:jackson-databind-nullable:0.2.11'
    implementation platform("com.fasterxml.jackson:jackson-bom:2.22.2")

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'uk.gov.justice.service.laa:laa-spring-boot-starter-oauth2'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'

    implementation 'io.micrometer:micrometer-core:1.17.1'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-IOMICROMETER-19233327
    implementation 'org.springframework.security:spring-security-core:7.1.1'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORKSECURITY-19267441
    implementation 'org.springframework.security:spring-security-crypto:7.1.1'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORKSECURITY-19267391
    implementation 'org.springframework.security:spring-security-oauth2-jose:7.1.1'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORKSECURITY-19268249
    implementation 'org.springframework:spring-beans:7.0.9'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORK-19267072
    implementation 'org.springframework:spring-expression:7.0.9'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORK-19267073
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORK-19267075
    implementation 'org.springframework:spring-web:7.0.9'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORK-19267077
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORK-19267078
    implementation 'org.springframework:spring-webmvc:7.0.9'
    // fix https://security.snyk.io/vuln/SNYK-JAVA-ORGSPRINGFRAMEWORK-19267098

    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.25'

    implementation 'org.apache.commons:commons-lang3:3.20.0'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    implementation("org.springframework.boot:spring-boot-starter-flyway:4.1.1")
    implementation("org.flywaydb:flyway-database-postgresql")
    runtimeOnly 'org.postgresql:postgresql:42.7.13'
    runtimeOnly "org.flywaydb:flyway-database-postgresql"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:2.0.5"
    testImplementation 'org.testcontainers:postgresql:1.21.4'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        importOrder()
        removeUnusedImports()
        cleanthat()
        googleJavaFormat()
    }
}

tasks.register('checkstyleAll') {
    group = 'verification'
    description = 'Runs checkstyleMain, checkstyleTest, and checkstyleIntegrationTest.'
    dependsOn tasks.matching { it.name in ['checkstyleMain', 'checkstyleTest', 'checkstyleIntegrationTest'] }
}