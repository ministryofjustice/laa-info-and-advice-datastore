plugins {
    id 'io.freefair.lombok' version '9.5.0'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
    id 'com.diffplug.spotless' version "8.10.2"
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// --- Pact provider verification: dedicated source set, no DB, service layer mocked ---
sourceSets {
    pactTest {
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += compileClasspath
    }
}

configurations {
    pactTestImplementation.extendsFrom implementation, testImplementation
    pactTestRuntimeOnly.extendsFrom   runtimeOnly, testRuntimeOnly
}

dependencies {
    pactTestImplementation 'au.com.dius.pact.provider:spring7:4.7.0-beta.3'
    pactTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    pactTestImplementation 'org.apache.httpcomponents.client5:httpclient5'
}

// Fetches consumer pacts from the broker, verifies them against this app, publishes results.
tasks.register('pactTest', Test) {
    useJUnitPlatform()
    testClassesDirs = sourceSets.pactTest.output.classesDirs
    classpath       = sourceSets.pactTest.runtimeClasspath

    systemProperty 'pact.provider.version',        System.getenv('GIT_SHA') ?: project.version
    systemProperty 'pact.provider.branch',         System.getenv('GIT_BRANCH') ?: 'main'
    systemProperty 'pact.verifier.publishResults', 'true'
    systemProperty 'pact.broker.url',              System.getenv('PACT_BROKER_URL')
    systemProperty 'pact.broker.auth.username',    System.getenv('PACT_BROKER_USERNAME')
    systemProperty 'pact.broker.auth.password',    System.getenv('PACT_BROKER_PASSWORD')

    // Consumer version selectors - which consumer pacts to verify.
    def consumer       = System.getenv('PACT_CONSUMER')         // set by the broker webhook
    def consumerBranch = System.getenv('PACT_CONSUMER_BRANCH')  // set by the broker webhook
    def selectors = [ [mainBranch: true], [matchingBranch: true] ]
    if (consumer && consumerBranch) {
        selectors << [pacticipant: consumer, branch: consumerBranch]
    }
    systemProperty 'pactbroker.consumerversionselectors.rawjson',
        groovy.json.JsonOutput.toJson(selectors)
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(
                dir: it,
                exclude: [
                    '**/SpringBootMicroserviceApplication.class',
                    '**/*MapperImpl.class'
                ]
            )
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(
                dir: it,
                exclude: [
                    '**/SpringBootMicroserviceApplication.class',
                    '**/*MapperImpl.class'
                ]
            )
        }))
    }
}

dependencies {
    implementation project(':info-and-advice-datastore-api')
    implementation 'org.openapitools:jackson-databind-nullable:0.2.11'
    implementation platform("com.fasterxml.jackson:jackson-bom:2.22.2")

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'uk.gov.justice.service.laa:laa-spring-boot-starter-oauth2'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'

    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.26'

    implementation 'org.apache.commons:commons-lang3:3.20.0'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    implementation("org.springframework.boot:spring-boot-starter-flyway:4.1.1")
    implementation("org.flywaydb:flyway-database-postgresql")
    runtimeOnly 'org.postgresql:postgresql:42.7.13'
    runtimeOnly "org.flywaydb:flyway-database-postgresql"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:2.0.5"
    testImplementation 'org.testcontainers:postgresql:1.21.4'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        importOrder()
        removeUnusedImports()
        cleanthat()
        googleJavaFormat()
    }
}

tasks.register('checkstyleAll') {
    group = 'verification'
    description = 'Runs checkstyleMain, checkstyleTest, and checkstyleIntegrationTest.'
    dependsOn tasks.matching { it.name in ['checkstyleMain', 'checkstyleTest', 'checkstyleIntegrationTest'] }
}